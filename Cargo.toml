[package]
name = "compas"
version = "0.2.0"
edition = "2021"
authors = ["Alexandro Heredia <alexandro@heredia.fi>"]
description = "Local-first semantic search engine for codebases"
license = "MIT"
repository = "https://github.com/alexandroheredia/compas"
keywords = ["semantic-search", "code-search", "mcp", "llm", "embeddings"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "compas"
path = "src/bin/compas.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.14"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
indicatif = "0.17"
tree-sitter = "0.26"
tree-sitter-dart = "0.1"
tree-sitter-rust = "0.24.2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
walkdir = "2"
globset = "0.4"
regex = "1"
dirs = "5"
fs4 = "0.8"
qdrant-edge = "0.6.1"
fastembed = "5"
